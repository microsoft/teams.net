name: Build & Test & Lint

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'releases/core']
  push:
    branches: ['main', 'releases/core']

  merge_group:

permissions: read-all
              
jobs:
  build-test-lint:
    name: Build & Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

      - name: Setup .NET
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: dotnet test --no-restore --verbosity normal --logger trx --configuration Release

      - name: Pack
        if: steps.changes.outputs.code == 'true'
        run: dotnet pack --no-restore --configuration Release --output ./nupkgs

      - name: Upload nupkg as workflow artifact
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: ./nupkgs/*.nupkg

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only docs/assets changed. Skipping build."
