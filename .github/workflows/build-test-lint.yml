name: Build & Test & Lint

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'releases/core']
  push:
    branches: ['main', 'releases/core']

  merge_group:

permissions: read-all
              
jobs:
  build-test-lint:
    name: Build & Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!Assets/**'

      - name: Setup .NET
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: dotnet test --no-restore --verbosity normal --logger trx --configuration Release

      - name: Pack
        if: steps.changes.outputs.code == 'true'
        run: dotnet pack --no-restore --configuration Release --output ./nupkgs

      - name: Upload nupkg as workflow artifact
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkgs/*.nupkg

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only docs/assets changed. Skipping build."
