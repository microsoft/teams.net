# =============================================================================
# Teams.NET v2 PR validation pipeline.
#
# Validates the maintained v2 surface (Libraries/, Samples/, and Tests/).
# Always runs; the DetectChanges stage decides whether the build stage executes.
# The pipeline does not publish packages.
# Pushes are handled by publish.yaml.
# =============================================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main
      - releases/*

pool:
  vmImage: 'ubuntu-22.04'

variables:
  buildConfiguration: 'Release'

stages:
- stage: DetectChanges
  displayName: 'Detect Changed Paths'
  jobs:
  - job: detect
    displayName: 'Compute change flags'
    steps:
    - checkout: self
      fetchDepth: 0

    - bash: |
        set -euo pipefail

        echo "Build.Reason: ${BUILD_REASON:-unset}"
        echo "System.PullRequest.TargetBranch: ${SYSTEM_PULLREQUEST_TARGETBRANCH:-unset}"
        echo "System.PullRequest.TargetBranchName: ${SYSTEM_PULLREQUEST_TARGETBRANCHNAME:-unset}"
        echo "Build.SourceBranch: ${BUILD_SOURCEBRANCH:-unset}"

        if [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" ]; then
          target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          base="origin/$target"
        elif [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCHNAME:-}" ]; then
          base="origin/${SYSTEM_PULLREQUEST_TARGETBRANCHNAME}"
        elif [ "${BUILD_REASON:-}" = "PullRequest" ]; then
          echo "Warning: PullRequest run but target-branch variable is unset; defaulting to origin/release/v2.0"
          base="origin/release/v2.0"
        else
          base="HEAD^"
        fi

        echo "Diff base: $base"
        changed=$(git diff --name-only "$base"...HEAD)
        echo "Changed paths:"
        echo "$changed"

        legacy=false
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          case "$f" in
            *.md|docs/*|Assets/*)
              # Docs / asset-only — skip the build.
              ;;
            Libraries/*|Samples/*|Tests/*|Microsoft.Teams.sln|version.json)
              legacy=true
              ;;
            .editorconfig|.azdo/*|.azdo/*/*|.azdo/*/*/*|Makefile)
              legacy=true
              ;;
          esac
        done <<< "$changed"

        echo "legacyChanged=$legacy"
        echo "##vso[task.setvariable variable=legacyChanged;isOutput=true]$legacy"
      name: flags
      displayName: 'git diff and flag groups'

- stage: Build_V2
  displayName: 'Build v2'
  dependsOn: DetectChanges
  condition: eq(dependencies.DetectChanges.outputs['detect.flags.legacyChanged'], 'true')
  jobs:
  - job: BuildTestPack
    displayName: 'Build and test v2'
    steps:
    - template: templates/build-test-pack.yaml
      parameters:
        sourceRoot: '.'
