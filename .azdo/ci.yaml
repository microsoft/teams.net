# =============================================================================
# Teams.NET-PR — unified CI pipeline.
#
# Validates the Core product at repository root.
# Documentation-only changes skip the build stage.
# Pushes are handled by publish.yaml.
#
# Spec: docs/superpowers/specs/2026-05-12-pipeline-consolidation-design.md
# =============================================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main
      - releases/*

pool:
  vmImage: 'ubuntu-22.04'
  # TODO(SR21): Move to the network-isolated 1ES pool after CFS restore is green.

variables:
  buildConfiguration: 'Release'

stages:
- stage: DetectChanges
  displayName: 'Detect Changed Paths'
  jobs:
  - job: detect
    displayName: 'Compute change flags'
    steps:
    - checkout: self
      fetchDepth: 0

    - bash: |
        set -euo pipefail

        echo "Build.Reason: ${BUILD_REASON:-unset}"
        echo "System.PullRequest.TargetBranch: ${SYSTEM_PULLREQUEST_TARGETBRANCH:-unset}"
        echo "System.PullRequest.TargetBranchName: ${SYSTEM_PULLREQUEST_TARGETBRANCHNAME:-unset}"
        echo "Build.SourceBranch: ${BUILD_SOURCEBRANCH:-unset}"

        if [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" ]; then
          target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          base="origin/$target"
        elif [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCHNAME:-}" ]; then
          base="origin/${SYSTEM_PULLREQUEST_TARGETBRANCHNAME}"
        elif [ "${BUILD_REASON:-}" = "PullRequest" ]; then
          echo "Warning: PullRequest run but target-branch variable is unset; defaulting to origin/main"
          base="origin/main"
        else
          base="HEAD^"
        fi

        echo "Diff base: $base"
        changed=$(git diff --name-only "$base"...HEAD)
        echo "Changed paths:"
        echo "$changed"

        core=false
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          case "$f" in
            *.md|docs/*|Assets/*)
              # Docs / asset-only — skip the build.
              ;;
            *)
              core=true
              ;;
          esac
        done <<< "$changed"

        echo "coreChanged=$core"
        echo "##vso[task.setvariable variable=coreChanged;isOutput=true]$core"
      name: flags
      displayName: 'git diff and flag groups'

- stage: Build_Core
  displayName: 'Build Core'
  dependsOn: DetectChanges
  condition: eq(dependencies.DetectChanges.outputs['detect.flags.coreChanged'], 'true')
  jobs:
  - job: BuildTestPack
    displayName: 'Build, Test, Pack — Core'
    steps:
    - template: templates/build-test-pack.yaml
      parameters:
        sourceRoot: '.'
